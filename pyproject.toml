[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankigen"
version = "2.0.0"
description = "Daily batch pipeline that generates new Anki cards from your existing collection and a personal prompt profile."
requires-python = ">=3.10"
dependencies = [
    # Pinned together, on purpose. From 9.10 on, ddgs's DuckDuckGo engine fails
    # every request with "malformed headers" and quietly falls back to Bing,
    # which serves a CI runner trending junk on bad days. 9.9.3 works, but only
    # with the primp it was built against: primp 2.x rejects its browser
    # profiles ("Invalid impersonate"). Probe a newer pair from a runner (the
    # lab/image-search branch has a workflow for it) before loosening this.
    "ddgs>=9.9.3,<9.10",
    "primp>=0.15,<0.16",
    # Reads each pipeline's cron in its own time zone, for the hourly tick.
    "cronsim>=2.6",
    "duckdb>=1.0",
    # Embeddings from an ONNX model in-process, so dedup needs no server and
    # no key. It is what lets the pipeline run on a throwaway CI machine.
    "fastembed>=0.8",
    "genanki>=0.13",
    # Every downloaded illustration is re-encoded as JPEG: Anki's importer
    # silently dropped some of the PNGs and WebPs image search returns.
    "pillow>=10.0",
    "numpy>=1.24",
    "openai>=1.40",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
# Pushing cards into Anki over AnkiWeb sync. An extra because it is a large
# download with a Rust backend, and the pipeline works without it.
push = ["anki>=25.0"]
# The study guide as a PDF (guide.py). WeasyPrint needs Pango from the system
# (libpango on Linux); without it the guide is written as HTML only.
guide = ["markdown>=3.5", "weasyprint>=62"]
dev = ["pytest>=8"]

[project.scripts]
ankigen = "ankigen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ankigen = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An editable install cannot be built from a path containing U+2800, so tests
# import the package straight from src/.
pythonpath = ["src"]
