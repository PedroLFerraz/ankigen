# The Android app (android/): tests and a debug APK on every change to it.
#
# Each build is kept as an artifact. On master the APK also replaces the one
# on the `app-latest` pre-release, a fixed link a phone can download from
# without signing in to GitHub. Every build signs with android/app/debug.keystore,
# so a new APK installs over the old one.
name: android

on:
  pull_request:
    paths: ["android/**", "pipelines/data-platform/pipeline.yaml", ".github/workflows/android.yml"]
  push:
    branches: [master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # the app-latest release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # The unit tests read pipelines/data-platform/pipeline.yaml, so a change
      # there that the app could no longer read fails here.
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: ankigen-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish to the app-latest pre-release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ankigen.apk
          gh release view app-latest > /dev/null 2>&1 || \
            gh release create app-latest --prerelease --title "AnkiGen app (latest)" \
              --notes "The Android app, rebuilt from master on every change to android/."
          gh release upload app-latest ankigen.apk --clobber
