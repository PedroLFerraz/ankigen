name: Claude review

# Reviews every PR when it opens or gets new commits. PRs from forks are
# skipped: they can't read the token secret.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md and README.md first for the project's conventions.

            Look for, in this order:
            1. Bugs: wrong behavior, unhandled edge cases, crashes, races, data loss.
            2. Security: secrets, unsafe input handling, permissions.
            3. Tests: behavior the PR changes that no test covers.
            4. Whether the PR does what its linked issue (Closes #N) asks for.

            Put each finding as an inline comment on the line it is about, with why it matters
            and a concrete fix. Skip style nitpicks a formatter would catch. If a previous review
            on this PR raised something that is now fixed, say so.

            Finish with one top-level comment: a one-line verdict ("Looks good" or
            "Needs changes"), then a short list of the findings by severity.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
