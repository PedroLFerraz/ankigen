# The daily run, on GitHub's machines rather than yours.
#
# Each run gets a clean Linux VM that is destroyed afterwards, so everything
# the pipeline needs is either fetched here or cached:
#
#   code        cloned from this repo
#   collection  synced down from AnkiWeb, since the runner cannot see your
#               machine. The cards go back the same way, so nothing is
#               downloaded and imported by hand
#   embeddings  computed in-process by fastembed; there is no Ollama here
#   warehouse   restored from the Actions cache, saved again at the end
#   the cards   synced back to AnkiWeb, and also kept as an artifact
#
# Free on public repositories. Note that GitHub disables scheduled workflows
# after 60 days without a commit, so a dormant repo stops running silently.
name: daily cards

on:
  # GitHub's scheduler is best-effort: at the top of the hour it is at its
  # busiest and drops runs outright, which is how the first 09:00 run never
  # happened. So an odd minute, and a second chance later that stands down if
  # the first one worked (see `gate`).
  schedule:
    - cron: "17 8 * * *"     # 08:17 UTC = 05:17 America/Sao_Paulo
    - cron: "43 11 * * *"    # the backup, 08:43 local
  workflow_dispatch:
    inputs:
      deck:
        description: "One deck to write for. Blank runs today's whole plan."
        required: false
        type: string
      topic:
        description: "What to write about (needs a deck)."
        required: false
        type: string
      prompt:
        description: "Extra steer on top of the profile (needs a deck)."
        required: false
        type: string
      count:
        description: "How many cards (needs a deck). Blank uses the deck's quota."
        required: false
        type: string
      kind:
        description: "Card shape (needs a deck): command, shortcut, concept, build or scenario."
        required: false
        type: string
      run_date:
        description: "Curriculum day to (re)do, YYYY-MM-DD. Blank writes the next one."
        required: false
        type: string
      stages:
        description: "Only these stages, comma-separated (e.g. images,export,report). Blank runs all."
        required: false
        type: string

concurrency:                  # DuckDB takes one writer, and so does the cache
  group: daily-cards
  cancel-in-progress: false

jobs:
  # Only the backup schedule is ever turned away: a manual run always goes
  # ahead, and so does the first scheduled one. Only scheduled successes count,
  # since a manual run for one deck is not the day's plan.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = schedule ]; then
            today=$(date -u +%F)
            done=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-cards.yml/runs?event=schedule&status=success&created=>=$today" --jq .total_count)
            if [ "$done" -gt 0 ]; then
              echo "A scheduled run already succeeded today; standing down."
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  generate:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A kickoff day writes 100 cards; if Claude runs out and Gemini is busy,
    # walking the fallback chain can take minutes per request.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Check the setup is complete
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANKIWEB_KEY: ${{ secrets.ANKIWEB_KEY }}
        run: |
          missing=""
          [ -z "$GOOGLE_API_KEY" ] && missing="$missing GOOGLE_API_KEY"
          [ -z "$ANKIWEB_KEY" ] && missing="$missing ANKIWEB_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "ANKIWEB_KEY comes from 'ankigen push --login'. See docs/GITHUB_ACTIONS.md."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Graphviz draws the diagrams the model describes for a card (visuals.py);
      # without it those cards fall back to searching the web for a picture.
      # Pango is what WeasyPrint lays the study guide's PDF out with.
      - run: sudo apt-get install -y --no-install-recommends graphviz libpango-1.0-0 libpangoft2-1.0-0

      # [gemini] pulls google-genai, which is an extra because it is the one
      # provider that does not speak the OpenAI protocol. Without it the run
      # gets all the way to the first request before failing.
      # [guide] for the study guide's PDF.
      - run: pip install ".[gemini,push,guide]"

      # Claude writes and checks the cards, on the Claude subscription behind
      # CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`). If this install fails,
      # or the token is missing or out of usage, the run carries on on Gemini.
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      # The warehouse holds every past run: what was generated, what was kept,
      # and the embedding cache. Losing it is survivable — the next run rebuilds
      # from the collection — but it would forget which cards it already made.
      - name: Restore the warehouse
        uses: actions/cache/restore@v6
        id: warehouse
        with:
          path: data/warehouse.duckdb
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Restore the collection
        uses: actions/cache/restore@v6
        id: collection
        with:
          path: data/anki
          key: anki-collection-${{ github.run_id }}
          restore-keys: anki-collection-

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Run the pipeline
        env:
          ANKI_COLLECTION_PATH: data/anki/collection.anki2
          ANKIWEB_KEY: ${{ secrets.ANKIWEB_KEY }}
          ANKIGEN_PROFILE: profiles/default.yaml
          DATA_DIR: data
          EMBEDDING_PROVIDER: fastembed
          # Claude writes (Opus) and a different Claude model checks (Sonnet),
          # on the subscription only: the code strips any API key from the
          # CLI's environment, so nothing here can be billed per token.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5,claude-sonnet-5' }}
          VERIFY_PROVIDER: ${{ vars.VERIFY_PROVIDER || 'claude' }}
          VERIFY_MODEL: ${{ vars.CLAUDE_VERIFY_MODEL || 'claude-sonnet-5' }}
          # When Claude cannot answer (usage limit, no token), every request
          # for the rest of the run goes to Gemini's free tier instead.
          FALLBACK_PROVIDER: gemini
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Best first. Free tiers meter per model, so every model in the chain
          # is another day's allowance. The code appends backup models with
          # allowances of their own (GEMINI_FALLBACK_MODELS, in config.py)
          # after whatever this is set to, including a repository variable.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash' }}
          # Gemini's checker, for the days it takes over. Not the writer's
          # model, and its backup (VERIFY_FALLBACK_MODELS) is not either.
          FALLBACK_VERIFY_MODEL: ${{ vars.VERIFY_MODEL || 'gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite' }}
          # The manual inputs arrive through the environment, never pasted into
          # the script, so a topic with a quote in it is only ever a topic.
          IN_RUN_DATE: ${{ inputs.run_date }}
          IN_DECK: ${{ inputs.deck }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_PROMPT: ${{ inputs.prompt }}
          IN_COUNT: ${{ inputs.count }}
          IN_KIND: ${{ inputs.kind }}
          IN_STAGES: ${{ inputs.stages }}
        run: |
          python -m ankigen pull

          # The curriculum is a queue: a plan run writes the day after the last
          # one in the collection, so a run by hand adds the next day rather
          # than redoing today's, and the scheduled run carries on after it.
          # The day is settled once here, and run, push and the summary all
          # use it. One deck by hand is not a day of the curriculum.
          if [ -n "$IN_RUN_DATE" ]; then
            day="$IN_RUN_DATE"
          elif [ -n "$IN_DECK" ]; then
            day=$(date -u +%F)
          elif [ -n "$IN_STAGES" ]; then
            echo "::error::Redoing stages needs run_date: the day to redo."
            exit 1
          else
            day=$(python -m ankigen next)
          fi
          echo "RUN_DATE=$day" >> "$GITHUB_ENV"

          # Built up rather than branched: the inputs are independent, and the
          # CLI already rejects a topic or prompt with no deck.
          args=(--date "$day")
          [ -n "$IN_DECK" ]   && args+=(--deck "$IN_DECK")
          [ -n "$IN_TOPIC" ]  && args+=(--topic "$IN_TOPIC")
          [ -n "$IN_PROMPT" ] && args+=(--prompt "$IN_PROMPT")
          [ -n "$IN_COUNT" ]  && args+=(--count "$IN_COUNT")
          [ -n "$IN_KIND" ]   && args+=(--kind "$IN_KIND")
          # Re-running only the later stages redoes a day's pictures without
          # writing new cards, and the push then refreshes them on the notes.
          IFS=', ' read -r -a stages <<< "$IN_STAGES"
          for stage in "${stages[@]}"; do
            [ -n "$stage" ] && args+=(--stage "$stage")
          done

          echo "ankigen run ${args[*]}"
          python -m ankigen run "${args[@]}"
          # push syncs down again first, so anything reviewed while the run was
          # working is merged before the new cards go up.
          python -m ankigen push --date "$day"

      # The run's page on GitHub, which is what the app on a phone shows:
      # what was written, what got a picture, what was dropped and why.
      - name: Summarise the run
        if: always()
        continue-on-error: true
        env:
          DATA_DIR: data
          ANKIGEN_PROFILE: profiles/default.yaml
        run: |
          python -m ankigen summary ${RUN_DATE:+--date "$RUN_DATE"} >> "$GITHUB_STEP_SUMMARY"

      # Only on success: a failed run's working copy may be empty or
      # half-synced, and caching that poisons every run after it.
      - name: Save the collection
        if: success()
        uses: actions/cache/save@v6
        with:
          path: data/anki
          key: anki-collection-${{ github.run_id }}

      - name: Save the warehouse
        if: always()            # a failed generate still advanced ingest
        uses: actions/cache/save@v6
        with:
          path: data/warehouse.duckdb
          key: warehouse-${{ github.run_id }}

      - name: Upload the cards
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cards-${{ env.RUN_DATE || 'unknown' }}
          path: |
            data/out/**/*.apkg
            data/out/**/guide_*.pdf
            data/out/**/run_report.json
          if-no-files-found: warn
          retention-days: 90
