# One run of one pipeline (pipelines/<id>/), on GitHub's machines.
#
# Started two ways:
#   tick.yml        on the pipeline's own schedule, through workflow_call
#   by hand         Actions > run pipeline, or the app's "Run now"
#
# Each run gets a clean Linux VM that is destroyed afterwards, so everything
# the pipeline needs is either fetched here or cached:
#
#   code        cloned from this repo
#   collection  synced down from AnkiWeb, since the runner cannot see your
#               machine. One for every pipeline: there is one account
#   embeddings  computed in-process by fastembed; there is no Ollama here
#   warehouse   one per pipeline, restored from the Actions cache
#   the cards   synced back to AnkiWeb (when the pipeline pushes), and kept
#               as an artifact with the study guide and run report
#   the outcome written to the ankigen-status branch, where the tick reads
#               what already ran and the app reads what happened
name: run pipeline
run-name: "${{ inputs.pipeline }} · ${{ inputs.deck || inputs.run_date || 'next day' }}"

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which pipeline, the folder name under pipelines/."
        required: true
        type: string
        default: data-platform
      deck:
        description: "One deck to write for. Blank runs the pipeline's next day."
        required: false
        type: string
      topic:
        description: "What to write about (needs a deck)."
        required: false
        type: string
      prompt:
        description: "Extra steer on top of the profile (needs a deck)."
        required: false
        type: string
      count:
        description: "How many cards (needs a deck). Blank uses the deck's quota."
        required: false
        type: string
      kind:
        description: "Card shape (needs a deck): command, shortcut, concept, build or scenario."
        required: false
        type: string
      run_date:
        description: "Curriculum day to (re)do, YYYY-MM-DD. Blank writes the next one."
        required: false
        type: string
      stages:
        description: "Only these stages, comma-separated (e.g. images,export,report). Blank runs all."
        required: false
        type: string
  workflow_call:
    inputs:
      pipeline:
        required: true
        type: string
      # The time the tick ran it for. Recorded, so the tick knows it ran.
      scheduled_for:
        required: false
        type: string
        default: ""
      attempt:
        required: false
        type: number
        default: 1

jobs:
  run:
    runs-on: ubuntu-latest
    # A kickoff day writes 100 cards; if Claude runs out and Gemini is busy,
    # walking the fallback chain can take minutes per request.
    timeout-minutes: 60
    # One run at a time touches AnkiWeb and the caches, whichever pipeline it
    # is. GitHub keeps only one waiting run per group and cancels an older
    # one for a newer, which is why the tick runs due pipelines one after
    # another instead of starting them all; a cancelled one is due again.
    concurrency:
      group: ankigen-sync
      cancel-in-progress: false
    permissions:
      contents: write       # the ankigen-status branch

    env:
      PIPELINE: ${{ inputs.pipeline }}
      ANKI_COLLECTION_PATH: data/anki/collection.anki2
      DATA_DIR: data
      EMBEDDING_PROVIDER: fastembed

    steps:
      - uses: actions/checkout@v7

      - name: Check the pipeline and the setup
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANKIWEB_KEY: ${{ secrets.ANKIWEB_KEY }}
        run: |
          echo "STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          if [ ! -f "pipelines/$PIPELINE/pipeline.yaml" ]; then
            echo "::error::No pipeline '$PIPELINE': pipelines/$PIPELINE/pipeline.yaml does not exist."
            exit 1
          fi
          missing=""
          [ -z "$GOOGLE_API_KEY" ] && missing="$missing GOOGLE_API_KEY"
          [ -z "$ANKIWEB_KEY" ] && missing="$missing ANKIWEB_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "ANKIWEB_KEY comes from 'ankigen push --login'. See docs/GITHUB_ACTIONS.md."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Graphviz draws the diagrams the model describes for a card (visuals.py);
      # without it those cards fall back to searching the web for a picture.
      # Pango is what WeasyPrint lays the study guide's PDF out with.
      - run: sudo apt-get install -y --no-install-recommends graphviz libpango-1.0-0 libpangoft2-1.0-0

      # [gemini] pulls google-genai, which is an extra because it is the one
      # provider that does not speak the OpenAI protocol. Without it the run
      # gets all the way to the first request before failing.
      # [guide] for the study guide's PDF.
      - run: pip install ".[gemini,push,guide]"

      # Claude writes and checks the cards, on the Claude subscription behind
      # CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`). If this install fails,
      # or the token is missing or out of usage, the run carries on on its
      # fallback (Gemini, unless the pipeline says otherwise).
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      # The pipeline's own settings: its models, budget and outputs, from
      # pipelines/<id>/pipeline.yaml. Secrets are the repository's, shared.
      - name: Load the pipeline's settings
        run: python -m ankigen.pipelines env "$PIPELINE" >> "$GITHUB_ENV"

      # The warehouse holds every past run: what was generated, what was kept,
      # and the embedding cache. Losing it is survivable — the next run rebuilds
      # from the collection — but it would forget which cards it already made.
      - name: Restore the warehouse
        uses: actions/cache/restore@v6
        id: warehouse
        with:
          path: data/pipelines/${{ inputs.pipeline }}/warehouse.duckdb
          key: warehouse-${{ inputs.pipeline }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: warehouse-${{ inputs.pipeline }}-

      # Before there were pipelines the one warehouse lived in data/ itself.
      # A cache is matched by its path as well as its key, so this finds only
      # those, once, and moves the last one where the pipeline now keeps it.
      - name: Restore the warehouse from before pipelines
        if: inputs.pipeline == 'data-platform' && steps.warehouse.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        id: legacy
        with:
          path: data/warehouse.duckdb
          key: warehouse-before-pipelines
          restore-keys: warehouse-
      - if: steps.legacy.outputs.cache-matched-key != ''
        run: mkdir -p data/pipelines/data-platform && mv data/warehouse.duckdb data/pipelines/data-platform/

      - name: Restore the collection
        uses: actions/cache/restore@v6
        id: collection
        with:
          path: data/anki
          key: anki-collection-${{ inputs.pipeline }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: anki-collection-

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Run the pipeline
        env:
          ANKIWEB_KEY: ${{ secrets.ANKIWEB_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # For a pipeline that writes with an OpenAI-compatible provider.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # The manual inputs arrive through the environment, never pasted into
          # the script, so a topic with a quote in it is only ever a topic.
          IN_RUN_DATE: ${{ inputs.run_date }}
          IN_DECK: ${{ inputs.deck }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_PROMPT: ${{ inputs.prompt }}
          IN_COUNT: ${{ inputs.count }}
          IN_KIND: ${{ inputs.kind }}
          IN_STAGES: ${{ inputs.stages }}
        run: |
          python -m ankigen pull

          # The curriculum is a queue: a plan run writes the day after the last
          # one this pipeline's decks have, so a run by hand adds the next day
          # rather than redoing today's, and the schedule carries on after it.
          # The day is settled once here, and run, push and the summary all
          # use it. One deck by hand is not a day of the curriculum.
          if [ -n "$IN_RUN_DATE" ]; then
            day="$IN_RUN_DATE"
          elif [ -n "$IN_DECK" ]; then
            day=$(date -u +%F)
          elif [ -n "$IN_STAGES" ]; then
            echo "::error::Redoing stages needs run_date: the day to redo."
            exit 1
          else
            day=$(python -m ankigen next)
          fi
          echo "RUN_DATE=$day" >> "$GITHUB_ENV"

          # Built up rather than branched: the inputs are independent, and the
          # CLI already rejects a topic or prompt with no deck.
          args=(--date "$day")
          [ -n "$IN_DECK" ]   && args+=(--deck "$IN_DECK")
          [ -n "$IN_TOPIC" ]  && args+=(--topic "$IN_TOPIC")
          [ -n "$IN_PROMPT" ] && args+=(--prompt "$IN_PROMPT")
          [ -n "$IN_COUNT" ]  && args+=(--count "$IN_COUNT")
          [ -n "$IN_KIND" ]   && args+=(--kind "$IN_KIND")
          # Re-running only the later stages redoes a day's pictures without
          # writing new cards, and the push then refreshes them on the notes.
          IFS=', ' read -r -a stages <<< "$IN_STAGES"
          for stage in "${stages[@]}"; do
            [ -n "$stage" ] && args+=(--stage "$stage")
          done

          echo "ankigen run ${args[*]}"
          python -m ankigen run "${args[@]}"
          # push syncs down again first, so anything reviewed while the run was
          # working is merged before the new cards go up. A pipeline can keep
          # its cards out of Anki: then they are only in the artifact's .apkg.
          if [ "$ANKIGEN_PUSH" = "true" ]; then
            python -m ankigen push --date "$day"
          else
            echo "This pipeline does not push; its cards are in the artifact's .apkg."
          fi

      # The run's page on GitHub, which is what the app on a phone shows:
      # what was written, what got a picture, what was dropped and why.
      - name: Summarise the run
        if: always()
        continue-on-error: true
        run: |
          python -m ankigen summary ${RUN_DATE:+--date "$RUN_DATE"} >> "$GITHUB_STEP_SUMMARY"

      # Only on success: a failed run's working copy may be empty or
      # half-synced, and caching that poisons every run after it.
      - name: Save the collection
        if: success()
        uses: actions/cache/save@v6
        with:
          path: data/anki
          key: anki-collection-${{ inputs.pipeline }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the warehouse
        if: always() && hashFiles(format('data/pipelines/{0}/warehouse.duckdb', inputs.pipeline)) != ''
        uses: actions/cache/save@v6
        with:
          path: data/pipelines/${{ inputs.pipeline }}/warehouse.duckdb
          key: warehouse-${{ inputs.pipeline }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the cards
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cards-${{ inputs.pipeline }}-${{ env.RUN_DATE || 'unknown' }}
          path: |
            data/pipelines/${{ inputs.pipeline }}/out/**/*.apkg
            data/pipelines/${{ inputs.pipeline }}/out/**/guide_*.pdf
            data/pipelines/${{ inputs.pipeline }}/out/**/run_report.json
            data/pipelines/${{ inputs.pipeline }}/out/**/cards.json
          if-no-files-found: warn
          retention-days: 90

      # What happened, for the tick (did this scheduled time run?) and for the
      # app (what did it make?). Runs even when the job failed: a failure the
      # tick never hears of would be retried every hour, forever.
      - name: Record the run
        if: always()
        env:
          CONCLUSION: ${{ job.status }}
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          ATTEMPT: ${{ inputs.attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The record needs only pydantic and cronsim, so it can still be
          # written when the install above is what failed.
          python -c "import ankigen.pipelines" 2>/dev/null \
            || pip install -q pydantic pydantic-settings pyyaml cronsim
          export PYTHONPATH=src

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ankigen-status > /dev/null; then
            git fetch origin ankigen-status
            git worktree add --detach status FETCH_HEAD
          else
            # The first record ever: a branch with no history but this.
            git worktree add --detach status HEAD
            (cd status && git checkout --orphan ankigen-status && git rm -rfq .)
          fi

          trigger=manual
          [ -n "$SCHEDULED_FOR" ] && trigger=schedule
          python -m ankigen.pipelines record "$PIPELINE" --status-dir status \
            --conclusion "$CONCLUSION" --trigger "$trigger" \
            --scheduled-for "$SCHEDULED_FOR" --attempt "$ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" \
            --started-at "$STARTED_AT" ${RUN_DATE:+--date "$RUN_DATE"}

          cd status
          git add -A
          git commit -qm "$PIPELINE: $CONCLUSION ${RUN_DATE:-} ($trigger)" || exit 0
          for _ in 1 2 3; do
            git push -q origin HEAD:refs/heads/ankigen-status && exit 0
            git fetch -q origin ankigen-status && git rebase -q FETCH_HEAD
          done
          echo "::error::Could not record the run on ankigen-status."
          exit 1
