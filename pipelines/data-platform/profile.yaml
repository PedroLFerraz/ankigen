        - command: "moving around: pwd, cd, ls, and the home directory"
        - concept: "absolute versus relative paths, and what ., .. and ~ mean"
        - shortcut: "terminal shortcuts: Tab completion, Ctrl+C, Ctrl+L and the arrow keys"
        - shortcut: "command history: Ctrl+R, !!, history, and re-running a command"
        - shortcut: "editing the command line: Ctrl+A, Ctrl+E, Ctrl+U and Ctrl+W"
        - command: "listing files: ls -l, ls -a, ls -lh, and reading the output"
        - command: "creating and removing: mkdir, touch, rm, rm -r and rmdir"
        - command: "copying, moving and renaming: cp, cp -r and mv"
        - command: "reading files: cat, less, head and tail"
        - shortcut: "moving around inside less: space, b, /search, n and q"
        - command: "getting help: man, --help, and reading a man page"
        - command: "wildcards: *, ? and braces, and what the shell expands"
        - command: "editing a file with nano: open, save and exit"
        - shortcut: "surviving vim: i, Esc, :w, :q, :wq and :q!"
        - concept: "users, the root user, and sudo"
        - command: "file permissions: reading rwx in ls -l, chmod and chown"
        - command: "pipes and redirection: |, >, >>, 2> and <"
        - command: "searching text: grep, grep -i, grep -r and grep -v"
        - command: "finding files: find by name, type and modification time"
      2:
        - command: "counting and sorting: wc, sort, uniq and cut"
        - concept: "processes, PIDs, and what happens when you run a command"
        - command: "watching processes: ps aux, top and htop"
        - command: "stopping processes: Ctrl+C, kill, kill -9 and pkill"
        - command: "jobs: &, Ctrl+Z, bg, fg, jobs and nohup"
        - concept: "environment variables, PATH, and export"
        - build: "shell configuration in .bashrc: aliases and exported variables"
        - command: "installing software: apt update, apt install and apt remove"
        - command: "disk space: df -h, du -sh, and finding what is big"
        - command: "archives: tar czf, tar xzf, zip and unzip"
        - command: "calling URLs and downloading: curl and wget"
        - build: "a first bash script: shebang, variables, arguments and chmod +x"
        - concept: "exit codes, and how && and || use them"
        - build: "a bash script that stops on errors: set -euo pipefail and checking $?"
      3:
        - command: "connecting to a server: ssh, ssh-keygen and ~/.ssh/config"
        - command: "copying files between machines: scp and rsync"
        - command: "services with systemd: systemctl start, stop, status and enable"
        - command: "reading logs: journalctl -u, journalctl -f, and /var/log"
        - concept: "signals: SIGTERM, SIGKILL, SIGHUP, and graceful shutdown"
        - build: "scheduling a job with cron: crontab -e and the five time fields"
        - concept: "inodes, hard links and symbolic links"
        - concept: "file descriptors, stdin, stdout and stderr"
      4:
        - scenario: "a full disk: deleted files still held open, inodes, and log rotation"
        - scenario: "a process killed by the out-of-memory killer, and exit code 137"
        - scenario: "a script that works in your shell but not from cron"
        - scenario: "permission denied: ownership, execute bits, and directories"

