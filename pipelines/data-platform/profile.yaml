# AnkiGen prompt profile.
# `ankigen decks` lists your decks; `ankigen validate` checks this file against
# them and prints the curriculum's timeline; `ankigen plan` shows what a run
# would generate and the exact prompts.

learner:
  level: "new to Linux, containers and cloud infrastructure; comfortable with Python and SQL"
  language: English
  goals:
    # Quote anything containing ": " - unquoted, YAML reads it as a mapping.
    - "Learn data platform engineering on AWS from the ground up, from the terminal to system design"
    - "Use the tools day to day: the commands, the shortcuts, the files you actually write"
    - "Understand how they work underneath, and later why they fail in production"

style:
  max_answer_words: 40
  examples_per_prompt: 4
  rules:
    - Prefer what the learner will actually type, read or be asked about when doing the work.
    - When a concept has a common misconception, write the card to target it.
    - For tooling, test behaviour, not version-specific trivia.

# Cards you keep failing get a fresh angle (an example, a contrast) instead of a rephrase.
weak_cards:
  enabled: true
  min_lapses: 2
  max_ease: 2100
  max_per_deck: 1

global_quota: 20
verify: true

# Fetch an illustration when the model judges one genuinely helps. Only
# concept and scenario cards ask for one; commands and code never do.
# `image_context` is put in front of that deck's image searches, so "airflow
# pool" is searched as "Apache Airflow pool" and not as a swimming pool.
images: true

# Empty = notes go straight into the deck above, tagged ankigen::run_<date>,
# so there is nothing to merge. Set e.g. "AnkiGen" for a subdeck instead.
inbox: ""

# The curriculum. Each deck starts on its `start:` date, covers its topics once
# in order at daily_quota / 5 topics a day (5 cards each), and stops; the next
# deck starts the day after. The first deck's first day is a kickoff of
# first_day_quota cards. `ankigen validate` prints when each deck runs.
#
# The dates are the curriculum's days, not the calendar's: each run writes the
# day after the last one in the collection. The schedule writes one a day, and
# every run by hand writes one more, which moves every date below up by a day.
#
# Topics come in four levels, 1 (never used it) to 4 (interview), and each has
# a kind that decides what its cards look like:
#   command   a task, and the command for it: learned both ways
#   shortcut  a task, and the keys for it: learned both ways
#   concept   a short question, and a one-sentence answer
#   build     a real file or script with one part hidden
#   scenario  a situation, what happens and why (mostly level 4)
#
# A deck can still be a plain `topics:` list instead, written in its
# card_type (basic, cloze or detailed), rotating when it has no start date.
decks:
  # === The Data Platform curriculum: from the terminal to system design on AWS.
  # Numbered so Anki lists the decks in the order they are studied.

  - deck: Data Platform::01 Linux
    new_deck: true
    start: 2026-09-27
    first_day_quota: 100
    daily_quota: 20
    card_type: basic
    image_context: "Linux"
    instructions: >
      Assume a Linux server such as Ubuntu or Amazon Linux, used through a
      terminal, with bash as the shell.
    levels:
