# How this pipeline runs. Its curriculum is in profile.yaml beside it.
# Checked against pipelines/schema.json; the AnkiGen app rewrites this file,
# so comments here are not kept.
name: Data Platform
enabled: false
schedule:
  # 05:17 in São Paulo: an odd minute, because GitHub's scheduler drops runs
  # on the hour. Each run writes the next curriculum day.
  cron: "17 5 * * *"
  timezone: America/Sao_Paulo
outputs:
  guide_pdf: true
  push_to_ankiweb: true
models:
  writer: claude
  writer_models: [claude-opus-5-5, claude-sonnet-5]
  checker: claude
  checker_models: [claude-sonnet-5]
budget:
  # 0: no cap.
  max_llm_calls_per_run: 0
