# História do Brasil, em português, no ritmo do Anki.
#
# Para o PDF do dia bater com o que o Anki mostra, o Anki tem que mostrar
# exatamente os cards que esta pipeline escreve, na ordem em que chegam:
#   - sem primeiro dia gigante (nenhum first_day_quota): 10 cards todo dia;
#   - nas opções do baralho "História do Brasil": Novos cards/dia = 10,
#     ordem de coleta "Posição crescente", ordem dos novos "Ordem de coleta".
# Se você pular um dia no Anki, o PDF passa a ficar um dia à frente.

learner:
  level: "adulto que estudou História do Brasil na escola e esqueceu quase tudo"
  language: "português do Brasil"
  goals:
    - "Entender a história do Brasil em ordem, da colonização até hoje"
    - "Saber as datas, os nomes e os acontecimentos principais de cada período"
    - "Entender as causas e as consequências: por que cada coisa aconteceu"

style:
  max_answer_words: 30
  examples_per_prompt: 4
  rules:
    - Uma pergunta por fato ou ideia; prefira o que um bom livro didático cobraria.
    - Dê a data ou o período quando ele ajudar a situar o fato.
    - Quando houver um equívoco comum (um mito escolar), escreva o card para corrigi-lo.

weak_cards:
  enabled: true
  min_lapses: 2
  max_ease: 2100
  max_per_deck: 1

global_quota: 10
verify: true
images: true
inbox: ""

# Cada baralho começa no dia seguinte ao fim do anterior, 2 tópicos (10 cards)
# por dia, em ordem cronológica. `ankigen validate` mostra as datas.
decks:
  - deck: História do Brasil::01 Antes de 1500 e a Chegada dos Portugueses
    new_deck: true
    start: 2026-10-10
    daily_quota: 10
    image_context: "história do Brasil"
    levels:
      1:
        - concept: "os povos indígenas antes de 1500: tupis, jês e aruaques"
