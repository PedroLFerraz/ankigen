        - concept: "o Tratado de Tordesilhas (1494)"
        - concept: "a chegada de Cabral em 1500"
        - concept: "a carta de Pero Vaz de Caminha"
        - concept: "o pau-brasil, o escambo e as feitorias"
        - concept: "o período pré-colonial (1500-1530) e as expedições guarda-costas"
